[binaries]
c = '/mnt/jiangchangliang/toolchain/usr/bin/aarch64-linux-gnu-gcc-10'
cpp = '/mnt/jiangchangliang/toolchain/usr/bin/aarch64-linux-gnu-g++-10'
ar = '/mnt/jiangchangliang/toolchain/usr/bin/aarch64-linux-gnu-ar'
strip = '/mnt/jiangchangliang/toolchain/usr/bin/aarch64-linux-gnu-strip'
pkg-config = 'pkg-config'
llvm-config = '/mnt/jiangchangliang/hardware_acceleration/.build-tools/llvm-config-aarch64'

[properties]
sys_root = '/mnt/jiangchangliang/sysroot'
pkg_config_libdir = ['/mnt/jiangchangliang/sysroot/usr/lib/aarch64-linux-gnu/pkgconfig', '/mnt/jiangchangliang/sysroot/usr/lib/pkgconfig', '/mnt/jiangchangliang/sysroot/usr/share/pkgconfig']
needs_exe_wrapper = true

[built-in options]
c_args = ['--sysroot=/mnt/jiangchangliang/sysroot']
cpp_args = ['--sysroot=/mnt/jiangchangliang/sysroot']
c_link_args = ['--sysroot=/mnt/jiangchangliang/sysroot', '-B/mnt/jiangchangliang/sysroot/usr/lib/aarch64-linux-gnu/', '-Wl,-rpath-link,/mnt/jiangchangliang/sysroot/usr/lib/aarch64-linux-gnu', '-Wl,-rpath-link,/mnt/jiangchangliang/sysroot/lib/aarch64-linux-gnu']
cpp_link_args = ['--sysroot=/mnt/jiangchangliang/sysroot', '-B/mnt/jiangchangliang/sysroot/usr/lib/aarch64-linux-gnu/', '-Wl,-rpath-link,/mnt/jiangchangliang/sysroot/usr/lib/aarch64-linux-gnu', '-Wl,-rpath-link,/mnt/jiangchangliang/sysroot/lib/aarch64-linux-gnu']
prefix = '/usr'
libdir = 'lib/aarch64-linux-gnu'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
